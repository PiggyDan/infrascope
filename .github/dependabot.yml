version: 2

# Quiet, reviewable updates:
# - cooldown: wait 14 days after a release before proposing it (supply-chain hygiene)
# - minor/patch updates arrive as ONE grouped PR per ecosystem per week
# - the frontend toolchain (Vite, Vitest, React, TypeScript) has peer dependencies on
#   each other, so its major upgrades are grouped too; one-by-one they can't install
updates:
  - package-ecosystem: pip
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 14 }
    groups:
      python-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    cooldown: { default-days: 14 }
    groups:
      frontend-minor-patch:
        update-types: [minor, patch]
      frontend-toolchain-major:
        patterns: ["vite", "vitest", "@vitejs/*", "react", "react-dom", "@types/react*", "typescript"]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directories: ["/", "/testtarget", "/frontend"]
    schedule: { interval: weekly }
    cooldown: { default-days: 14 }
