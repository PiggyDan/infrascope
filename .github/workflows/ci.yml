name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · lint + tests on PostgreSQL
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          # Throwaway credentials for an ephemeral CI-only container.
          POSTGRES_USER: infrascope
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: infrascope_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U infrascope -d infrascope_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://infrascope:ci-only-password@localhost:5432/infrascope_test
      INFRASCOPE_TEST_TARGET_URL: http://localhost:8081
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Start the test-target service
        working-directory: testtarget
        run: |
          nohup python -m uvicorn app:app --host 127.0.0.1 --port 8081 > /tmp/testtarget.log 2>&1 &
          for i in $(seq 30); do curl -sf http://127.0.0.1:8081/healthy && exit 0; sleep 1; done
          cat /tmp/testtarget.log; exit 1
      - name: Tests (unit + integration, PostgreSQL)
        run: pytest -v

  frontend:
    name: Frontend · typecheck + tests + build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-fund
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  stack:
    name: Docker Compose · end-to-end
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Create .env with a random database password
        run: |
          pw=$(openssl rand -hex 24)
          echo "::add-mask::$pw"
          sed "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=$pw/" .env.example > .env
      - name: Build and start the stack
        run: docker compose up -d --build --wait
      - name: Create a temporary ADMIN key
        run: |
          key=$(docker compose exec -T api python -m app.cli create-api-key --name ci --role ADMIN | tail -n 1)
          echo "::add-mask::$key"
          echo "INFRASCOPE_API_KEY=$key" >> "$GITHUB_ENV"
      - name: Smoke test (outage → incident → recovery → restart persistence)
        shell: pwsh
        run: ./scripts/smoke-test.ps1 -VerifyRestart
      - name: Test suite inside the API container
        run: docker compose exec -T api pytest -q
      - name: Dashboard and security checks
        run: |
          headers=$(curl -sfI http://127.0.0.1:3000/)
          echo "$headers" | grep -qi "^content-security-policy: default-src 'self'"
          echo "$headers" | grep -qi "^x-frame-options: deny"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/v1/targets)" = "401"
          test -z "$(docker compose port db 5432 2>/dev/null)"          # database not published
          ! docker compose exec -T web wget -q -T 3 -O /dev/null http://db:5432   # web can't reach db
          echo "all checks passed"
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down (ephemeral CI volume)
        if: always()
        run: docker compose down -v
