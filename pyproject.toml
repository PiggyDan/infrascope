[project]
name = "infrascope"
version = "0.1.0"
description = "Open-source infrastructure monitoring and incident detection platform"
requires-python = ">=3.12"
license = { text = "MIT" }

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = [
    "B008",  # FastAPI Depends()/Query() in argument defaults is idiomatic
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: tests that need the running test-target service (INFRASCOPE_TEST_TARGET_URL)",
]
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]
