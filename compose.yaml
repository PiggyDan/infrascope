name: infrascope

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-infrascope}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (copy .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:-infrascope}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    # No "ports:" — PostgreSQL is reachable only on the private network.
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  testtarget:
    build: ./testtarget
    restart: unless-stopped
    environment:
      SLOW_DELAY_SECONDS: ${SLOW_DELAY_SECONDS:-3}
    # Not published to the host; only the API can reach it.
    networks: [backend]

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      testtarget:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-infrascope}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-infrascope}
      ALLOWED_TARGET_HOSTS: ${ALLOWED_TARGET_HOSTS:-testtarget}
      MONITOR_TICK_SECONDS: ${MONITOR_TICK_SECONDS:-1}
      HTTP_TIMEOUT_SECONDS: ${HTTP_TIMEOUT_SECONDS:-5}
      FAILURE_THRESHOLD: ${FAILURE_THRESHOLD:-2}
      RECOVERY_THRESHOLD: ${RECOVERY_THRESHOLD:-2}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Used only by `docker compose exec api pytest`
      TEST_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-infrascope}:${POSTGRES_PASSWORD}@db:5432/infrascope_test
      INFRASCOPE_TEST_TARGET_URL: http://testtarget:8080
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    networks: [backend, edge]

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:8080"
    # Only needs to reach the API; never the database or test target.
    networks: [edge]

networks:
  # internal: containers on this network have no route to the internet or LAN.
  backend:
    internal: true
  edge: {}

volumes:
  pgdata:
